      - paragraph [ref=e205]: Mizahın olayı zaten bu; seyirciyi önce bir rahatlatıp sonra kendi önyargılarıyla tokatlamak. Mahkemenin bu sanatsal üslubu görmezden gelip şakaların düz mahkeme ifadesi gibi okuması, ifade özgürlüğünü de mizahı da daracık bir alana hapsetmek demek.
    - generic [ref=e206]:
      - paragraph [ref=e207]: Asıl Soru
      - heading "Keyfimiz mi Kaçtı Yoksa Tehlike mi Var?" [level=2] [ref=e208]
      - paragraph [ref=e209]: Kamuya açık haberlerde "onlarca şikâyet" ifadesi geçiyor; tek başına şikâyet sayısı ise kamu barışının bozulduğunu göstermeye yetmez. Yasa, birilerinin canının sıkılmasını engellemeyi değil, kamu düzeninin gerçekten fiziki olarak bozulmasını engellemeyi hedefler.
      - paragraph [ref=e210]: Cumhurbaşkanlığı makamı, ülkenin en büyük siyasi gücü. AİHM çizgisi de siyasetçilerin sıradan kişilere göre daha geniş eleştiriye katlanması gerektiğini söyler. Bu yüzden "diktatör" kelimesi gibi ağır siyasal nitelemelerde bağlam, hiciv formu ve şiddete çağrı olup olmadığı belirleyici hale gelir.
      - paragraph [ref=e211]: Tutuklama kararı, olayı çözmek yerine henüz mahkeme bile kurulmamışken faturayı Deniz'e ödetiyor. Buradaki mesele şakaları beğenip beğenmemek değil, yargının yasayı düzgün uygulayıp uygulamadığı.
      - paragraph [ref=e212]: Şakanın komik olup olmadığı veya ahlaki sınırları sabaha kadar tartışılabilir. Ama bir insanı mahkemesiz tutuklayıp içeri tıkmak için kelimelerin ötesinde ciddi gerekçeler olmalı. 'Ölü Deniz' dosyasında bu gerekçelerin olmaması, herkesin hukuki güvenliği açısından soru işaretleri yaratmaya devam ediyor.
