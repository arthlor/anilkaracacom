<html lang="tr">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>

            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef', 
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(217, 70, 239, 0.05); 
        }
        
        .checkbox-pink {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid #f9a8d4;
            border-radius: 0.35rem;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .checkbox-pink::before {
            content: "";
            width: 0.70rem;
            height: 0.70rem;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            background-color: white;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
        }

        .checkbox-pink:checked {
            background-color: #d946ef;
            border-color: #d946ef;
        }

        .checkbox-pink:checked::before {
            transform: scale(1);
        }

        [x-cloak] { display: none !important; }

        .locked-card { 
            opacity: 0.6;
            filter: grayscale(80%);
            pointer-events: none; 
        }
        
        .task-row:last-child {
            border-bottom: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-50 to-fuchsia-50 min-h-screen text-stone-600 antialiased selection:bg-brand-300 selection:text-brand-900"
      x-data="gizemApp()">

    <main class="max-w-md mx-auto px-5 py-10 md:py-16 flex flex-col gap-6 min-h-screen">
        
        <header class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-brand-900 tracking-tight">Gizem For Freedom</h1>
            <p class="text-stone-500 text-sm font-medium">30 Günlük Özgürlük Ritüelin</p>
        </header>

        <section class="glass-card rounded-2xl p-6 space-y-4 sticky top-4 z-10 transition-shadow shadow-md">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-sm font-bold text-brand-900 uppercase tracking-widest">TOPLAM İLERLEME</h2>
                    <p class="text-xs text-stone-400 mt-1"><span x-text="totalCompletedTasks"></span> / 90 Görev</p>
                </div>
                <div class="text-3xl font-bold tracking-tighter text-brand-500">
                    <span x-text="progressPercentage"></span>%
                </div>
            </div>
            <div class="w-full h-3 bg-brand-100 rounded-full overflow-hidden">
                <div class="h-full bg-brand-500 transition-all duration-700 ease-out"
                     :style="`width: ${progressPercentage}%`"></div>
            </div>
        </section>

        <section class="space-y-4 flex-1 pb-10">
            <template x-for="(day, index) in days" :key="day.id">
                
                <div class="glass-card rounded-2xl transition-all duration-300 overflow-hidden"
                     :class="[
                         isLocked(index) ? 'locked-card' : 'cursor-pointer hover:border-brand-300 hover:shadow-md',
                         isDayFullyCompleted(index) ? 'bg-brand-50/60 border-brand-200' : 'bg-white/90'
                     ]">
                    
                    <div class="p-4 flex items-center justify-between" 
                         @click="if(!isLocked(index)) toggleDay(index)">
                        <div class="flex items-center gap-4">
                            <div class="flex flex-col items-center justify-center w-12 h-12 rounded-full font-bold shadow-sm"
                                 :class="isDayFullyCompleted(index) ? 'bg-brand-500 text-white' : 'bg-rose-100 text-brand-900'">
                                <span class="text-[10px] uppercase leading-none opacity-80">Gün</span>
                                <span class="text-lg leading-none mt-0.5" x-text="day.id"></span>
                            </div>
                            <div>
                                <h3 class="font-semibold text-brand-900" 
                                    :class="{'line-through opacity-70': isDayFullyCompleted(index)}">
                                    <span x-text="getCompletedTasksForDay(index)"></span> / 3 Görev
                                </h3>
                                <p class="text-xs font-medium text-stone-400 uppercase tracking-wider mt-0.5" 
                                   x-text="isDayFullyCompleted(index) ? 'Tamamlandı' : 'Devam Ediyor'"></p>
                            </div>
                        </div>

                        <div>
                            <template x-if="isLocked(index)">
                                <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                            </template>
                            <template x-if="!isLocked(index) && !isDayFullyCompleted(index) && expandedDay !== index">
                                <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </template>
                            <template x-if="!isLocked(index) && !isDayFullyCompleted(index) && expandedDay === index">
                                <svg class="w-5 h-5 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                            </template>
                            <template x-if="isDayFullyCompleted(index)">
                                <svg class="w-6 h-6 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                            </template>
                        </div>
                    </div>

                    <div x-show="expandedDay === index" x-collapse x-cloak>
                        <div class="px-2 pb-4 pt-1 max-w-full">
                            <div class="bg-white/50 rounded-xl overflow-hidden shadow-inner border border-rose-50">
                                
                                <template x-for="(task, taskKey) in day.tasks" :key="taskKey">
                                    <label class="task-row p-4 flex items-start gap-4 cursor-pointer hover:bg-rose-50/50 transition-colors border-b border-brand-50"
                                           :class="{ 'opacity-60 bg-brand-50/30': task.completed }">
                                        <div class="mt-0.5" @click.stop="">
                                            <input type="checkbox" class="checkbox-pink" 
                                                   x-model="task.completed" 
                                                   @change="toggleTaskCompletion(index)">
                                        </div>
                                        <div class="flex-1 space-y-1">
                                            <div class="flex items-center gap-2">
                                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider"
                                                      :class="{
                                                          'bg-emerald-100 text-emerald-700': taskKey === 'easy',
                                                          'bg-amber-100 text-amber-700': taskKey === 'medium',
                                                          'bg-rose-100 text-rose-700': taskKey === 'hard'
                                                      }"
                                                      x-text="taskKey === 'easy' ? 'Kolay' : (taskKey === 'medium' ? 'Orta' : 'Zor')">
                                                </span>
                                            </div>
                                            <p class="text-sm text-stone-600 leading-snug transition-all"
                                               :class="{ 'line-through text-stone-400': task.completed }"
                                               x-text="task.desc"></p>
                                        </div>
                                    </label>
                                </template>

                            </div>
                        </div>
                    </div>

                </div>
            </template>
        </section>

        <div x-cloak x-show="progressPercentage === 100" 
             class="fixed bottom-6 left-6 right-6 bg-brand-500 text-white rounded-2xl p-6 text-center shadow-2xl z-50 animate-bounce">
            <h3 class="font-bold text-xl">30 Günlük Seri Tamamlandı! 🎉</h3>
            <p class="text-sm text-brand-100 opacity-90 mt-2">Daha otonom, daha huzurlu ve daha özgürsün. Seninle gurur duyuyoruz Gizem!</p>
        </div>

        <footer class="mt-auto text-center pb-8">
            <button @click="resetAll()" class="text-xs font-medium text-stone-300 hover:text-red-400 transition-colors uppercase tracking-widest focus:outline-none">
                Tüm İlerlemeyi Sıfırla (Tehlikeli)
            </button>
        </footer>

    </main>

                    medium: { desc: "İzmir'de veya şehir dışında doğada güzel bir piknikle veya restoran yemeği ile 30. günü KUTLA", completed: false },
                    hard: { desc: "Gelecek 6 ayın için sadece KENDİ kalbinin kurallarına bağlı olan, net ve heyecanlı kariyer rotanı çiz", completed: false }
                }
            }
        ];

        document.addEventListener('alpine:init', () => {
            Alpine.data('gizemApp', () => ({
                days: [],
                expandedDay: null, 
                
                init() {
                    const saved = localStorage.getItem('gizem30Daysv2');
                    
                    if (saved) {
                        try {
                            const parsedDays = JSON.parse(saved);
                            
                            this.days = PRD_DATA.map(templateDay => {
                                const savedDay = parsedDays.find(d => d.id === templateDay.id);
                                if (savedDay) {
                                    return {
                                        id: templateDay.id,
                                        tasks: {
                                            easy: { desc: templateDay.tasks.easy.desc, completed: savedDay.tasks.easy.completed || false },
                                            medium: { desc: templateDay.tasks.medium.desc, completed: savedDay.tasks.medium.completed || false },
                                            hard: { desc: templateDay.tasks.hard.desc, completed: savedDay.tasks.hard.completed || false }
                                        }
                                    };
                                }
                                return JSON.parse(JSON.stringify(templateDay));
                            });
                        } catch(e) {
                            this.days = JSON.parse(JSON.stringify(PRD_DATA));
                        }
                    } else {
                        this.days = JSON.parse(JSON.stringify(PRD_DATA));
                    }

                    this.$nextTick(() => {
                        for(let i=0; i < this.days.length; i++){
                            if(!this.isLocked(i) && !this.isDayFullyCompleted(i)) {
                                this.expandedDay = i;
                                break;
                            }
                        }
                    });
                },

                saveTasks() {
                    localStorage.setItem('gizem30Daysv2', JSON.stringify(this.days.map(d => ({
                        id: d.id,
                        tasks: {
                            easy: { completed: d.tasks.easy.completed },
                            medium: { completed: d.tasks.medium.completed },
                            hard: { completed: d.tasks.hard.completed }
                        }
                    }))));
                },

                toggleDay(index) {
                    this.expandedDay = this.expandedDay === index ? null : index;
                },

                toggleTaskCompletion(index) {
                    setTimeout(() => {
                        this.saveTasks();
                        
                        // If day just got fully completed, collapse and open next
                        if (this.isDayFullyCompleted(index)) {
                           this.expandedDay = null; 
                           if (index + 1 < this.days.length) {
                               setTimeout(() => { this.expandedDay = index + 1; }, 400);
                           }
                        }
                    }, 50);
                },

                getCompletedTasksForDay(index) {
                    const t = this.days[index].tasks;
                    let count = 0;
                    if(t.easy.completed) count++;
                    if(t.medium.completed) count++;
                    if(t.hard.completed) count++;
                    return count;
                },

                isDayFullyCompleted(index) {
                    return this.getCompletedTasksForDay(index) === 3;
                },

                isLocked(index) {
                    if (index === 0) return false; 
                    for (let i = 0; i < index; i++) {
                        if (!this.isDayFullyCompleted(i)) return true;
                    }
                    return false;
                },

                resetAll() {
                    if(confirm("Tüm 30 günlük ilerlemeyi SIFIRLAMAK istediğine emin misin? Bu işlem geri alınamaz.")) {
                        localStorage.removeItem('gizem30Daysv2');
                        window.location.reload();
                    }
                },

                get totalCompletedTasks() {
                    let total = 0;
                    this.days.forEach(d => {
                        if(d.tasks.easy.completed) total++;
                        if(d.tasks.medium.completed) total++;
                        if(d.tasks.hard.completed) total++;
                    });
                    return total;
                },

                get progressPercentage() {
                    return Math.round((this.totalCompletedTasks / 90) * 100);
                }
            }))
        })
    </script>
</body>
</html>
